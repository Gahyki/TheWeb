services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Overridable so a reverse proxy in front of the container can be
      # trusted without editing this file.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      # In-container bind must accept the container network; the
      # loopback-only published port above is the exposure boundary.
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
